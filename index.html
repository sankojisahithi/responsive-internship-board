<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse and search internship opportunities.">
  <title>Internship Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>Internship Board</h1>
      <p>Find your next opportunity</p>
    </div>
  </header>

  <main class="container">
    <section class="filters" aria-label="Search and filter internships">
      <div class="field">
        <label for="search">Search internships</label>
        <input
          type="search"
          id="search"
          placeholder="Search role, company, or keyword..."
          autocomplete="off"
        >
      </div>

      <div class="field">
        <label for="domain">Filter by domain</label>
        <select id="domain">
          <option value="all">All domains</option>
          <option value="Web Development">Web Development</option>
          <option value="Python">Python</option>
          <option value="Design">Design</option>
          <option value="Data Science">Data Science</option>
        </select>
      </div>
    </section>

    <div class="results-heading">
      <h2>Explore internships</h2>
      <p id="status" role="status" aria-live="polite">
        Loading internships...
      </p>
    </div>

    <section
      id="internship-list"
      class="internship-list"
      aria-label="Internship results"
    ></section>
  </main>

  <footer class="footer">
    <p>Internship Board · Find opportunities to learn and grow</p>
  </footer>
</body>
</html>
